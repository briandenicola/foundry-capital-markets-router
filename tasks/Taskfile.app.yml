version: '3'

vars:
  APPS_DIR: apps
  # Images are tagged with the commit they were built from. "latest" is not a version, and on
  # demo day the question "which build is running?" needs an answer.
  COMMIT_VERSION:
    sh: git rev-parse HEAD | cut -c 1-8
  # Services with a Dockerfile today. The three lane services are stubs until T-023, T-024,
  # and T-025; listing them here before they build would only move the failure further from
  # its cause.
  BUILDABLE: router-service

tasks:
  default:
    desc: Show available app tasks
    cmds:
      - task --list --taskfile ./tasks/Taskfile.app.yml

  init:
    desc: Initialise the workload stack. Local state, so there is nothing to configure.
    cmds:
      - terraform -chdir=./{{.APPS_DIR}} init -reconfigure -input=false
      - terraform -chdir=./{{.APPS_DIR}} validate

  build:
    desc: Build and push all service images to the private registry
    cmds:
      - for: { var: BUILDABLE }
        task: build-service
        vars:
          SERVICE: '{{.ITEM}}'

  build-service:
    desc: Build one service image in ACR. Usage - task app:build-service SERVICE=router-service
    requires:
      vars: [SERVICE]
    cmds:
      # az acr build runs the build inside the registry. Nothing is built or pushed from this
      # machine, so no Docker daemon is required and no image crosses the public internet.
      - az acr build
        --registry {{.ACR_NAME}}
        --image {{.SERVICE}}:{{.COMMIT_VERSION}}
        --image {{.SERVICE}}:latest
        --file src/{{.SERVICE}}/Dockerfile .
    vars:
      ACR_NAME:
        sh: terraform -chdir=./infrastructure output -raw acr_name

  apply:
    desc: Apply the workload stack against the images built from the current commit
    cmds:
      - terraform -chdir=./{{.APPS_DIR}} apply -auto-approve -compact-warnings
        -var "app_name={{.APP_NAME}}"
        -var "image_tag={{.COMMIT_VERSION}}"
    vars:
      APP_NAME:
        sh: terraform -chdir=./infrastructure output -raw app_name

  deploy:
    desc: Build images, then apply. Images exist before anything references them.
    cmds:
      - task: init
      - task: build
      - task: apply

  seed:
    desc: Generate and load synthetic demo data (research corpus, e-comms, orders, alerts)
    cmds:
      - dotnet run --project src/tools/SyntheticData -- --seed 20260910 --all

  logs:
    desc: Tail logs for a container app. Usage - task app:logs -- router-service
    cmds:
      - az containerapp logs show --name {{.CLI_ARGS}}
        --resource-group $(terraform -chdir=./{{.APPS_DIR}} output -raw resource_group_name)
        --follow

  destroy:
    desc: Destroy the workload stack, leaving the platform intact
    cmds:
      - terraform -chdir=./{{.APPS_DIR}} destroy -auto-approve -compact-warnings
        -var "app_name={{.APP_NAME}}"
        -var "image_tag={{.COMMIT_VERSION}}"
    vars:
      APP_NAME:
        sh: terraform -chdir=./infrastructure output -raw app_name
