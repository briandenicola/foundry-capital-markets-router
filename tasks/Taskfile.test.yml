version: '3'

tasks:
  default:
    desc: Run the test suites that exist today
    # integration and e2e stay out of the default run: they need a deployed environment, and a
    # default task that always fails is a default task people stop running.
    #
    # contract is now in, because tests/Fcmr.Contract.Tests exists (T-015). It is red while the
    # endpoints it specifies are still being written, and that is the process working. Removing
    # it from the default run to restore a green board would delete the only signal that says how
    # much of the published contract is actually served.
    cmds:
      - task: unit
      - task: contract
      - task: ui

  unit:
    desc: Run unit tests with coverage collection
    # Solution-wide, minus two suites that measure something other than the behaviour of a unit:
    # Fcmr.Contract.Tests checks conformance to a published contract, and Fcmr.Persistence.Tests
    # needs the Cosmos emulator running. Listing unit projects by hand instead would silently stop
    # running the next one somebody adds.
    cmds:
      - dotnet test --filter "FullyQualifiedName!~Fcmr.Contract.Tests&FullyQualifiedName!~Fcmr.Persistence.Tests" --collect:"XPlat Code Coverage" --settings coverlet.runsettings --results-directory ./TestResults

  coverage:
    desc: Enforce the 70% coverage threshold on the decision-critical assemblies
    cmds:
      - ./scripts/check-coverage.sh 70 Fcmr.Router.Decisions
      - ./scripts/check-coverage.sh 70 Fcmr.Research.Domain
      - ./scripts/check-coverage.sh 70 Fcmr.OrderRouting.Domain

  contract:
    desc: Run contract tests against the published API contracts
    cmds:
      - dotnet test tests/Fcmr.Contract.Tests

  persistence:
    desc: Run persistence tests against the local Cosmos emulator
    # Requires 'task cosmos:up' first. Excluded from the default run because it needs a container,
    # and included here rather than hidden because a suite nobody can find is a suite nobody runs.
    cmds:
      - task: :cosmos:test

  integration:
    desc: Run integration tests against a deployed environment
    cmds:
      - dotnet test tests/Fcmr.Integration.Tests

  e2e:
    desc: Run Playwright end-to-end tests (requires a deployed environment)
    dir: tests/e2e
    cmds:
      - npm ci
      - npx playwright test

  ui:
    desc: Run scoreboard UI unit tests
    dir: src/webui
    cmds:
      - npm ci
      - npm run test
