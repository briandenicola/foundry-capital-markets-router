name: quality-gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  no-public-endpoints:
    name: no public endpoint policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Enforce private-by-construction
        run: ./scripts/policy-no-public-endpoints.sh

  least-privilege-scope:
    name: least privilege role scope policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The quickest fix for a 403 is to widen the scope one level, and nothing in a plan or an
      # apply looks different afterwards. Checked here so that widening a grant costs a review.
      - name: Enforce resource-scoped role assignments
        run: ./scripts/policy-least-privilege-scope.sh

  no-development-environment:
    name: no development environment in deployment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # router-service disables Router.Invoke enforcement when the host reports the Development
      # environment. That affordance was justified by analogy to enable_private_networking, and
      # the analogy only holds if it is enforced the way that variable is enforced -- by a job
      # that fails the build -- rather than asserted in a code comment.
      #
      # Paired with a startup guard in Security/RouterAuthorization.cs, which refuses to start
      # unauthenticated on a managed platform. This job gives the PR-time signal; the guard closes
      # the portal and CLI paths that never open a pull request. Neither alone is sufficient.
      - run: ./scripts/policy-no-development-environment.sh

  cosmos-containers-match:
    name: cosmos containers match terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # tools/Fcmr.CosmosProvision duplicates the container list from infrastructure/cosmos.tf,
      # because Terraform cannot reach the local emulator. Duplicated truth drifts, and the drift
      # would not show up locally -- the persistence suite would pass against a database shape that
      # does not exist in Azure, and the failure would first appear on the deployed environment.
      - run: ./scripts/policy-cosmos-containers-match.sh

  terraform:
    name: terraform lint and scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.7.5
      - name: fmt
        run: terraform fmt -check -recursive infrastructure apps
      - name: validate infrastructure
        run: terraform -chdir=infrastructure init -backend=false && terraform -chdir=infrastructure validate
      - name: validate apps
        run: terraform -chdir=apps init -backend=false && terraform -chdir=apps validate
      - name: checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          soft_fail: false
          check: CKV_AZURE_*

  dotnet:
    name: dotnet build test coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: restore
        run: dotnet restore
      - name: format check
        run: dotnet format --verify-no-changes --no-restore
      - name: build
        run: dotnet build --no-restore --configuration Release
      # Two suites are excluded. The contract suite runs in its own job below, where its result is
      # reported on its own terms. Fcmr.Persistence.Tests needs the Cosmos emulator container and
      # is not run in CI at all yet -- it fails loudly rather than skipping when the emulator is
      # absent, deliberately, because a persistence suite that reports green without connecting to
      # anything is the failure mode it exists to prevent. Running it here means starting the
      # emulator service in the workflow, which is tracked on T-014a rather than half-done now.
      #
      # The filter matches tasks/Taskfile.test.yml:unit deliberately. Two spellings of "which
      # tests gate a merge" is how they drift.
      - name: test with coverage
        run: >-
          dotnet test --no-build --configuration Release
          --filter "FullyQualifiedName!~Fcmr.Contract.Tests&FullyQualifiedName!~Fcmr.Persistence.Tests"
          --collect:"XPlat Code Coverage" --settings coverlet.runsettings
          --results-directory ./TestResults
      - name: enforce coverage threshold
        run: |
          ./scripts/check-coverage.sh 70 Fcmr.Router.Decisions
          ./scripts/check-coverage.sh 70 Fcmr.Research.Domain
          ./scripts/check-coverage.sh 70 Fcmr.OrderRouting.Domain
          ./scripts/check-coverage.sh 70 Fcmr.Surveillance.Domain

  contract-conformance:
    name: contract conformance
    runs-on: ubuntu-latest
    # Required, as of T-018. The expiry recorded on this job when it was advisory has been reached:
    # the approval host now exists and serves the whole of specs/001-router-core/contracts/, so
    # every published operation is exercised over real HTTP and there is nothing left that is
    # expected to fail.
    #
    # It matters that this blocks rather than reports. The approval API is where Hard Rule 1 is
    # enforced -- segregation of duties, expiry, terminal-state finality, the audit record on every
    # call. A regression here is a compliance claim becoming false while the board stays green, and
    # an advisory job would let that merge.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: restore
        run: dotnet restore
      - name: build
        run: dotnet build --no-restore --configuration Release
      - name: contract tests
        run: dotnet test tests/Fcmr.Contract.Tests --no-build --configuration Release

  ui:
    name: ui lint typecheck test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/webui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test --if-present

  api-types:
    name: generated api types in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # The UI's types are generated from the C# decision library. If a contract type changes and
      # the types are not regenerated, the drift shows up on stage rather than here.
      - run: node scripts/generate-api-types.mjs --check

  no-simulated-reasoning:
    name: no simulated agent reasoning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # ADR-007. The demo's one irreplaceable claim is live agent reasoning; a replayed transcript
      # rendered in the product UI falsifies it, and a label does not repair that. Enforced here
      # rather than asserted in a doc, for the same reason the public-endpoint rule is.
      - run: ./scripts/policy-no-simulated-reasoning.sh

  diagrams:
    name: architecture diagrams in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # The .excalidraw sources AND the .svg renders are build output, not drawings. Regenerating
      # both here is what stops the architecture picture quietly diverging from the architecture,
      # which is the failure mode that makes diagrams untrustworthy and therefore unused. The SVG
      # is checked too, precisely because it is the copy people actually look at in the README.
      - run: node scripts/diagrams/generate-diagrams.mjs --out docs/diagrams --check
      - run: node scripts/diagrams/validate.mjs docs/diagrams

  preview-sdk-pins:
    name: preview sdk pin guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task lint:preview-sdk-pins
